name: branchpoint

services:
  # PostgreSQL for TrueForge
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trueforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: trueforge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trueforge -d trueforge']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis for TrueForge
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # TrueForge Server
  trueforge:
    image: ghcr.io/truefoundry/trueforge:latest
    ports:
      - "${TRUEFORGE_PORT:-8790}:8790"
    environment:
      NODE_ENV: production
      PORT: 8790
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: trueforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: trueforge
      STANDALONE: 'false'
      REDIS_URL: redis://redis:6379
      # Model provider - set your OpenAI key here
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # BRANCHPOINT Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: 8000
      BRANCHPOINT_ENV: production
      BRANCHPOINT_LOG_LEVEL: INFO
      # TrueForge integration
      BRANCHPOINT_TRUEFORGE_BASE_URL: http://trueforge:8790
      BRANCHPOINT_MODEL: ${BRANCHPOINT_MODEL:-openai/gpt-4o}
      BRANCHPOINT_TRUEFORGE_MCP_SERVER_NAME: branchpoint
      # MCP is served on same backend at /mcp
    depends_on:
      trueforge:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
